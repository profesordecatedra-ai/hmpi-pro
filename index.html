async function desc(pw){const d=b(D),k0=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);const k=await crypto.subtle.deriveKey({name:'PBKDF2',salt:d.slice(0,16),iterations:200000,hash:'SHA-256'},k0,{name:'AES-GCM',length:256},false,['decrypt']);return new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:d.slice(16,28)},k,d.slice(28)))}
async function go(pw){try{const h=await desc(pw);try{sessionStorage.setItem('hk',pw)}catch(e){}document.open();document.write(h);document.close()}catch(e){document.getElementById('e').textContent='Contraseña incorrecta';try{sessionStorage.removeItem('hk')}catch(x){}}}
document.getElementById('f').onsubmit=e=>{e.preventDefault();document.getElementById('e').textContent='Verificando…';go(document.getElementById('p').value)};
